<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Timer · 课堂计时</title>
<style>
  :root{
    --bg:#0b0f22; --panel:#141a35; --panel2:#1b2242; --text:#eef1ff; --muted:#8b93b8;
    --accent1:#7c5cff; --accent2:#22d3ee; --track:#242c50; --face:#101636; --line:#232a4a;
    --on-accent:#ffffff; --shadow:0 24px 60px rgba(0,0,0,.45);
    --warn:#ff5470; --ok:#34d399;
    --water1:#5b4bff; --water2:#22d3ee;
  }

  *{box-sizing:border-box}
  html{height:100%}

  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    padding:26px 20px;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text); background:var(--bg);
    background-image:
      radial-gradient(65% 65% at 8% 4%, color-mix(in srgb, var(--accent1) 24%, transparent), transparent 70%),
      radial-gradient(65% 65% at 94% 96%, color-mix(in srgb, var(--accent2) 22%, transparent), transparent 70%);
    transition:background-color .5s ease, color .5s ease, background-image .6s ease;
    -webkit-font-smoothing:antialiased;
  }
  body[data-phase="overtime"]{
    background-image:
      radial-gradient(65% 65% at 8% 4%, color-mix(in srgb, var(--warn) 30%, transparent), transparent 70%),
      radial-gradient(65% 65% at 94% 96%, color-mix(in srgb, #ffb020 24%, transparent), transparent 70%);
  }
  body[data-phase="ended"]{
    background-image:
      radial-gradient(65% 65% at 8% 4%, color-mix(in srgb, var(--ok) 26%, transparent), transparent 70%),
      radial-gradient(65% 65% at 94% 96%, color-mix(in srgb, var(--accent2) 22%, transparent), transparent 70%);
  }

  .app{
    width:min(960px,100%);
    margin:auto;
    transition:max-width .35s ease;
  }
  body.focus-mode .app{ max-width:520px; }

  /* ---------- header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap;
    margin-bottom:20px;
  }
  .brand{display:flex; align-items:center; gap:11px; min-width:0}
  .brand-dot{
    width:11px; height:11px; border-radius:50%; flex:none;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    box-shadow:0 0 14px var(--accent1);
  }
  h1{
    margin:0; font-size:15px; font-weight:800;
    letter-spacing:.22em; text-transform:uppercase;
    white-space:nowrap;
  }

  .tools{
    display:flex; align-items:center; gap:10px;
    flex-wrap:wrap; justify-content:flex-end;
    min-width:0;
    transition:opacity .3s ease;
  }
  body.focus-mode .tools{ display:none; }

  .icon-btn{
    width:38px; height:38px; flex:none;
    display:grid; place-items:center;
    font-size:16px; line-height:1; cursor:pointer;
    color:var(--text); background:var(--panel); border:1px solid var(--line);
    border-radius:12px; box-shadow:var(--shadow);
    transition:transform .15s, background-color .3s;
  }
  .icon-btn:hover{transform:translateY(-1px)}
  .icon-btn:active{transform:scale(.95)}

  #waterBtn{ color:var(--water2); }
  #waterBtn .drop-shape{ transition: fill-opacity .3s, opacity .3s; }
  #waterBtn[data-on="true"] .drop-shape{ fill:currentColor; fill-opacity:.25; }
  #waterBtn[data-on="false"] .drop-shape{ opacity:.5; }

  .theme-picker{
    display:flex; gap:8px; padding:7px 10px; border-radius:999px;
    background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow);
    flex-wrap:wrap; justify-content:center;
  }
  .swatch{
    width:24px; height:24px; border-radius:50%; border:0; padding:0;
    cursor:pointer; position:relative; flex:none;
    transition:transform .18s ease;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
  }
  .swatch:hover{transform:scale(1.16)}
  .swatch.is-active{transform:scale(1.16)}
  .swatch.is-active::after{
    content:""; position:absolute; inset:-5px; border-radius:50%;
    border:2px solid var(--text); opacity:.85;
  }

  /* ---------- layout ---------- */
  .stage{
    display:grid; grid-template-columns:1.05fr 1fr; gap:20px;
    transition:grid-template-columns .35s ease, max-width .35s ease;
  }
  @media (max-width:820px){ .stage{grid-template-columns:1fr} }

  body.focus-mode .stage{
    grid-template-columns:1fr;
    justify-items:center;
    gap:18px;
    max-width:480px;
    margin:0 auto;
  }

  .card{
    background:var(--panel); border:1px solid var(--line);
    border-radius:26px; padding:24px; box-shadow:var(--shadow);
    transition:background-color .45s ease, border-color .45s ease, box-shadow .45s ease, padding .3s ease;
    min-width:0;
    width:100%;
  }

  /* ---------- clock ---------- */
  .clock-card{
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px;
  }
  .clock-card[data-phase="overtime"]{
    border-color:color-mix(in srgb, var(--warn) 55%, var(--line));
    box-shadow:0 0 0 1px color-mix(in srgb, var(--warn) 35%, transparent), var(--shadow);
  }
  .clock-card[data-phase="ended"]{
    border-color:color-mix(in srgb, var(--ok) 55%, var(--line));
  }
  .clock-card.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97)}

  .status-chip{
    display:inline-flex; align-items:center; gap:8px;
    padding:7px 14px; margin-bottom:10px; border-radius:999px;
    background:var(--panel2); border:1px solid var(--line);
    font-size:10.5px; font-weight:800; letter-spacing:.18em;
    text-transform:uppercase; color:var(--muted);
    transition:color .35s, border-color .35s, background-color .35s;
    max-width:100%;
  }
  .status-chip .dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:none}
  .clock-card[data-phase="live"] .status-chip{
    color:var(--accent2);
    border-color:color-mix(in srgb, var(--accent2) 45%, transparent);
  }
  .clock-card[data-phase="live"] .status-chip .dot{animation:blink 1.6s ease-in-out infinite}
  .clock-card[data-phase="overtime"] .status-chip{
    color:var(--warn);
    border-color:color-mix(in srgb, var(--warn) 55%, transparent);
    background:color-mix(in srgb, var(--warn) 14%, var(--panel2));
  }
  .clock-card[data-phase="overtime"] .status-chip .dot{animation:blink .9s ease-in-out infinite}
  .clock-card[data-phase="ended"] .status-chip{
    color:var(--ok);
    border-color:color-mix(in srgb, var(--ok) 55%, transparent);
    background:color-mix(in srgb, var(--ok) 14%, var(--panel2));
  }

  .clock{
    width:100%; max-width:320px; height:auto; display:block;
    transition:max-width .35s ease;
  }
  body.focus-mode .clock{ max-width:360px; }

  .ring-track{fill:none; stroke:var(--track); stroke-width:14}
  .ring-progress{
    fill:none; stroke:url(#ringGrad); stroke-width:14; stroke-linecap:round;
    filter:drop-shadow(0 0 10px color-mix(in srgb, var(--accent1) 65%, transparent));
    transition:stroke-dashoffset .25s linear;
  }
  .face{fill:var(--face); stroke:var(--line); stroke-width:1}

  /* ---------- WATER + FIRE EFFECTS ---------- */
  .water-group{
    transition:opacity .45s ease;
    pointer-events:none;
  }
  body[data-water="off"] .water-group{ opacity:0; }

  .water-back{ fill:var(--water1); opacity:.55; }
  .water-front{ fill:var(--water2); opacity:.72; }

  .flame-back  { fill: var(--warn); opacity: .72; }
  .flame-mid   { fill: #ff9d00;     opacity: .88; }
  .flame-front { fill: #ffd93b;     opacity: .95; }

  .tick{stroke:var(--muted); stroke-width:1.4; stroke-linecap:round; opacity:.5}
  .tick.major{stroke:var(--text); stroke-width:2.6; opacity:.8}

  .hand{stroke:var(--text); stroke-linecap:round}
  .hand.hour{stroke-width:7}
  .hand.min{stroke-width:5}
  .hand.sec{stroke:var(--accent2); stroke-width:2.2}
  .cap{fill:var(--accent1)}
  .cap-in{fill:var(--panel)}

  .ringGrad stop:nth-child(1){stop-color:var(--accent1)}
  .ringGrad stop:nth-child(2){stop-color:var(--accent2)}

  .clock-card[data-phase="overtime"] .ringGrad stop:nth-child(1){stop-color:var(--warn)}
  .clock-card[data-phase="overtime"] .ringGrad stop:nth-child(2){stop-color:#ffb020}
  .clock-card[data-phase="overtime"] .ring-progress{
    animation:pulseRing 1.2s ease-in-out infinite;
    filter:drop-shadow(0 0 14px color-mix(in srgb, var(--warn) 80%, transparent));
  }
  .clock-card[data-phase="overtime"] .hand.sec{stroke:var(--warn)}
  .clock-card[data-phase="overtime"] .cap{fill:var(--warn)}

  .clock-card[data-phase="ended"] .ringGrad stop:nth-child(1){stop-color:var(--ok)}
  .clock-card[data-phase="ended"] .ringGrad stop:nth-child(2){stop-color:var(--accent2)}
  .clock-card[data-phase="ended"] .ring-progress{
    filter:drop-shadow(0 0 16px color-mix(in srgb, var(--ok) 75%, transparent));
  }

  .pct{
    margin-top:4px; line-height:1; font-weight:800; letter-spacing:-.035em;
    font-size:clamp(44px,9vw,60px); font-variant-numeric:tabular-nums;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .clock-card[data-phase="overtime"] .pct{
    background:linear-gradient(135deg,var(--warn),#ffb020);
    -webkit-background-clip:text; background-clip:text;
  }
  .clock-card[data-phase="ended"] .pct{
    background:linear-gradient(135deg,var(--ok),var(--accent2));
    -webkit-background-clip:text; background-clip:text;
  }
  .pct-sign{font-size:.44em; margin-left:2px; vertical-align:.42em}

  .clock-sub{
    margin-top:8px; font-size:14px; letter-spacing:.2em;
    color:var(--muted); font-variant-numeric:tabular-nums;
  }
  .notice{
    margin-top:10px; min-height:20px;
    font-size:12.5px; font-weight:700; letter-spacing:.1em;
    color:var(--muted); text-align:center;
    padding:0 6px;
  }
  .notice--warn{color:var(--warn)}
  .notice--celebrate{
    font-size:18px; letter-spacing:.02em;
    background:linear-gradient(90deg,var(--ok),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:pop .55s cubic-bezier(.2,.9,.3,1.3) both;
  }

  /* ---------- panel ---------- */
  .panel{
    display:flex; flex-direction:column; gap:16px;
    position:relative;
  }

  .focus-toggle{
    position:absolute;
    top:14px; right:14px;
    width:34px; height:34px;
    padding:0; display:grid; place-items:center;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel2);
    color:var(--muted);
    cursor:pointer;
    z-index:4;
    transition:color .2s, background-color .2s, transform .15s, box-shadow .2s;
  }
  .focus-toggle:hover{ color:var(--text); transform:translateY(-1px); }
  .focus-toggle:active{ transform:scale(.94); }
  .focus-toggle svg{ display:block; }
  .focus-toggle .eye-closed{ display:none; }
  body.focus-mode .focus-toggle .eye-open{ display:none; }
  body.focus-mode .focus-toggle .eye-closed{ display:block; }

  body.focus-mode .focus-toggle{
    position:fixed;
    top:20px; right:20px;
    width:38px; height:38px;
    z-index:60;
    background:var(--panel);
    box-shadow:var(--shadow);
  }

  .time-row{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding-right:52px; }
  .time-row input{
    width:74px; padding:11px 6px; text-align:center;
    font-family:inherit; font-size:22px; font-weight:700; font-variant-numeric:tabular-nums;
    color:var(--text); background:var(--panel2);
    border:1px solid var(--line); border-radius:13px;
    outline:none; transition:border-color .2s, box-shadow .2s;
    min-width:0;
  }
  .time-row input:focus{
    border-color:var(--accent1);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent1) 28%, transparent);
  }
  .colon{font-size:22px; font-weight:700; color:var(--muted)}
  .tz{margin-left:auto; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}

  .field-label{
    display:block; margin-bottom:9px;
    font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--muted); font-weight:700;
  }

  .actions{display:flex; gap:10px; margin-top:4px; flex-wrap:wrap}
  button{font-family:inherit; cursor:pointer; border-radius:14px; transition:transform .12s, filter .2s, opacity .2s}
  button:active{transform:scale(.975)}
  button:disabled{cursor:default; opacity:.55; transform:none}

  .btn-primary{
    flex:1 1 140px; padding:14px 18px; border:0;
    font-size:15px; font-weight:750; letter-spacing:.02em;
    color:var(--on-accent);
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    box-shadow:0 12px 26px -10px var(--accent1);
  }
  .btn-primary:hover:not(:disabled){filter:brightness(1.08)}
  body[data-phase="overtime"] .btn-primary{
    background:linear-gradient(135deg,var(--warn),#ffb020);
    box-shadow:0 12px 26px -10px var(--warn);
  }
  .btn-ghost{
    flex:0 1 auto; padding:14px 20px; font-size:15px; font-weight:650;
    color:var(--text); background:var(--panel2); border:1px solid var(--line);
  }
  .btn-ghost:hover{filter:brightness(1.1)}
  /* Reset is only meaningful once the lesson is over; hide it until then. */
  .btn-ghost[hidden]{ display:none !important; }

  .stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:auto}
  .stat{
    background:var(--panel2); border:1px solid var(--line);
    border-radius:14px; padding:10px 13px; min-width:0;
  }
  .stat-k{
    display:block; margin-bottom:5px;
    font-size:9.5px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--muted); font-weight:700;
  }
  .stat-v{
    display:block; font-size:16px; font-weight:700; font-variant-numeric:tabular-nums;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .stat-v.is-warn{color:var(--warn)}

  /* ---------- focus mode ---------- */
  body.focus-mode .panel .time-field,
  body.focus-mode .panel .stats{
    display:none;
  }
  body.focus-mode .panel{
    background:transparent;
    border:none;
    box-shadow:none;
    padding:0;
    gap:0;
  }
  body.focus-mode .panel .actions{
    margin-top:0;
    justify-content:center;
  }
  body.focus-mode .btn-primary{ flex:1 1 160px; }
  body.focus-mode .btn-ghost{ flex:0 1 auto; }
  body.focus-mode .stage{ justify-items:stretch; }

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:30px;
    transform:translateX(-50%) translateY(14px);
    padding:11px 20px; border-radius:14px;
    background:var(--panel); border:1px solid var(--line);
    color:var(--text); font-size:13px; font-weight:650;
    box-shadow:var(--shadow);
    opacity:0; pointer-events:none; z-index:120;
    transition:opacity .28s ease, transform .28s ease;
    max-width:calc(100vw - 40px); text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- confetti ---------- */
  #confetti{
    position:fixed; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:80;
  }

  /* ---------- responsive ---------- */
  @media (max-width:560px){
    body{padding:16px 12px}
    .topbar{gap:10px; margin-bottom:14px}
    h1{font-size:13px; letter-spacing:.16em}
    .tools{width:100%; justify-content:space-between; gap:8px}
    .icon-btn{width:34px; height:34px; font-size:14px; border-radius:10px}
    .theme-picker{gap:6px; padding:6px 8px}
    .swatch{width:20px; height:20px}
    .swatch.is-active::after{inset:-4px; border-width:2px}
    .card{padding:18px; border-radius:20px}
    .stage{gap:14px}
    .stats{grid-template-columns:1fr 1fr}
    .stat{padding:9px 11px}
    .stat-v{font-size:15px}
    .time-row input{width:64px; font-size:20px}
    .colon{font-size:20px}
    .tz{display:none}
    .time-row{padding-right:46px}
    .focus-toggle{top:12px; right:12px; width:32px; height:32px}
    body.focus-mode .focus-toggle{top:14px; right:14px; width:36px; height:36px}
  }

  @media (max-width:400px){
    h1{font-size:12px; letter-spacing:.12em}
    .brand{gap:8px}
    .icon-btn{width:32px; height:32px; font-size:13px}
    .swatch{width:18px; height:18px}
    .theme-picker{gap:5px; padding:5px 7px}
    .card{padding:15px; border-radius:16px}
    .clock-sub{font-size:12px; letter-spacing:.14em}
    .stats{grid-template-columns:1fr}
  }

  @media (max-height:720px){
    body{padding-top:14px; padding-bottom:14px}
    .card{padding:16px}
    .topbar{margin-bottom:12px}
    .clock{max-width:250px}
    body.focus-mode .clock{max-width:300px}
  }

  @keyframes blink{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.35; transform:scale(.78)}}
  @keyframes pulseRing{0%,100%{opacity:1}50%{opacity:.45}}
  @keyframes pop{0%{transform:scale(.7); opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1); opacity:1}}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    15%{transform:translateX(-6px) rotate(-.6deg)}
    30%{transform:translateX(6px) rotate(.6deg)}
    45%{transform:translateX(-4px)}
    60%{transform:translateX(4px)}
    75%{transform:translateX(-2px)}
  }
</style>
</head>
<body data-phase="upcoming" data-water="on">

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>Lesson Timer</h1>
    </div>
    <div class="tools">
      <button id="copyBtn" class="icon-btn" type="button" title="Copy link — your state is saved in the URL">🔗</button>
      <button id="waterBtn" class="icon-btn" type="button" data-on="true" aria-pressed="true" title="Water &amp; fire effect on">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="drop-shape" d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
          <line class="drop-slash" x1="3" y1="3" x2="21" y2="21" style="display:none"/>
        </svg>
      </button>
      <button id="soundBtn" class="icon-btn" type="button" aria-pressed="true" title="Sound on">🔊</button>
      <div class="theme-picker" id="themePicker" role="group" aria-label="Choose theme"></div>
    </div>
  </header>

  <main class="stage">

    <section class="card clock-card" id="clockCard" data-phase="upcoming">
      <div class="status-chip"><span class="dot"></span><span id="statusText">Upcoming</span></div>

      <svg class="clock" viewBox="0 0 340 340" aria-hidden="true">
        <defs>
          <linearGradient id="ringGrad" class="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"></stop>
            <stop offset="100%"></stop>
          </linearGradient>
          <clipPath id="discClip">
            <circle cx="170" cy="170" r="130"/>
          </clipPath>
        </defs>

        <circle class="ring-track" cx="170" cy="170" r="150"></circle>
        <circle class="ring-progress" id="ringProgress" cx="170" cy="170" r="150"
                transform="rotate(-90 170 170)"></circle>

        <circle class="face" cx="170" cy="170" r="132"></circle>

        <g class="water-group" clip-path="url(#discClip)">
          <g id="waterInner">
            <path class="water-back" id="waterBack"  d="M 18 302 L 322 302 L 322 330 L 18 330 Z"/>
            <path class="water-front" id="waterFront" d="M 18 302 L 322 302 L 322 330 L 18 330 Z"/>
          </g>
        </g>

        <g class="water-group" clip-path="url(#discClip)">
          <g id="fireInner" style="opacity:0">
            <path class="flame flame-back"  id="flameBack"/>
            <path class="flame flame-mid"   id="flameMid"/>
            <path class="flame flame-front" id="flameFront"/>
            <g id="fireEmbers"></g>
          </g>
        </g>

        <g id="ticks"></g>

        <line id="handHour" class="hand hour" x1="170" y1="170" x2="170" y2="100"></line>
        <line id="handMin"  class="hand min"  x1="170" y1="170" x2="170" y2="66"></line>
        <line id="handSec"  class="hand sec"  x1="170" y1="170" x2="170" y2="52"></line>

        <circle class="cap" cx="170" cy="170" r="7"></circle>
        <circle class="cap-in" cx="170" cy="170" r="3"></circle>
      </svg>

      <div class="pct"><span id="pctNum">0</span><span class="pct-sign">%</span></div>
      <div class="clock-sub" id="digital">--:--:--</div>
      <div class="notice" id="notice" aria-live="polite">—</div>
    </section>

    <section class="card panel" id="panel">

      <button id="focusBtn" class="focus-toggle" type="button" aria-label="Enter focus mode" title="Enter focus mode">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle class="eye-open" cx="12" cy="12" r="3"/>

<script>
(() => {
  "use strict";

  /* =================== THEMES =================== */
  const THEMES = {
    aurora: { label:"Aurora", dark:true,  bg:"#0b0f22", panel:"#141a35", panel2:"#1b2242", text:"#eef1ff", muted:"#8b93b8",

              a1:"#4ade80", a2:"#a3e635", track:"#1d3626", face:"#0f1f16", line:"#1c3527",
              onAccent:"#06230f", shadow:"0 24px 60px rgba(0,0,0,.45)", warn:"#ff7b7b", ok:"#4ade80",
              water1:"#2eb85a", water2:"#9ee03c" },
    paper:  { label:"Paper",  dark:false, bg:"#f1f1ee", panel:"#ffffff", panel2:"#f6f6f4", text:"#17191b", muted:"#82888d",

              onAccent:"#0a1200", shadow:"0 24px 60px rgba(198,255,0,.10)", warn:"#ff2d55", ok:"#c6ff00",
              water1:"#c6ff00", water2:"#ff00c8" }
  };

  const root = document.documentElement;
  const themePicker = document.getElementById("themePicker");

  function applyTheme(id){
    const t = THEMES[id];
    if (!t) return;
    root.style.setProperty("--bg", t.bg);
    root.style.setProperty("--panel", t.panel);
    root.style.setProperty("--panel2", t.panel2);
    root.style.setProperty("--text", t.text);
    root.style.setProperty("--muted", t.muted);
    root.style.setProperty("--accent1", t.a1);
    root.style.setProperty("--accent2", t.a2);
    root.style.setProperty("--track", t.track);
    root.style.setProperty("--face", t.face);
    root.style.setProperty("--line", t.line);
    root.style.setProperty("--on-accent", t.onAccent);
    root.style.setProperty("--shadow", t.shadow);
    root.style.setProperty("--warn", t.warn);
    root.style.setProperty("--ok", t.ok);
    root.style.setProperty("--water1", t.water1);
    root.style.setProperty("--water2", t.water2);
    root.style.colorScheme = t.dark ? "dark" : "light";

    [...themePicker.children].forEach(b => b.classList.toggle("is-active", b.dataset.theme === id));
    try { localStorage.setItem("lessonTimerTheme", id); } catch(e){}
  }

  Object.entries(THEMES).forEach(([id, t]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "swatch";
    b.dataset.theme = id;
    b.title = t.label;
    b.setAttribute("aria-label", t.label + " theme");
    b.style.background = `linear-gradient(135deg, ${t.a1}, ${t.a2})`;
    b.addEventListener("click", () => applyTheme(id));
    themePicker.appendChild(b);
  });

  let savedTheme = null;
  try { savedTheme = localStorage.getItem("lessonTimerTheme"); } catch(e){}
  applyTheme(savedTheme && THEMES[savedTheme] ? savedTheme : "aurora");

  /* =================== CLOCK TICKS =================== */
  const NS = "http://www.w3.org/2000/svg";
  const ticksG = document.getElementById("ticks");
  for (let i = 0; i < 60; i++){
    const major = i % 5 === 0;
    const a = (i * 6) * Math.PI / 180;
    const rIn  = major ? 112 : 118;
    const rOut = 124;
    const l = document.createElementNS(NS, "line");
    l.setAttribute("x1", (170 + rIn  * Math.sin(a)).toFixed(2));
    l.setAttribute("y1", (170 - rIn  * Math.cos(a)).toFixed(2));
    l.setAttribute("x2", (170 + rOut * Math.sin(a)).toFixed(2));
    l.setAttribute("y2", (170 - rOut * Math.cos(a)).toFixed(2));
    l.setAttribute("class", major ? "tick major" : "tick");
    ticksG.appendChild(l);
  }

  /* =================== ELEMENTS =================== */
  const card       = document.getElementById("clockCard");
  const panel      = document.getElementById("panel");
  const statusText = document.getElementById("statusText");
  const pctNum     = document.getElementById("pctNum");
  const digital    = document.getElementById("digital");
  const notice     = document.getElementById("notice");
  const ring       = document.getElementById("ringProgress");

  const handHour = document.getElementById("handHour");
  const handMin  = document.getElementById("handMin");
  const handSec  = document.getElementById("handSec");

  const startH = document.getElementById("startH");
  const startM = document.getElementById("startM");
  const endH   = document.getElementById("endH");
  const endM   = document.getElementById("endM");

  const endBtn   = document.getElementById("endBtn");
  const resetBtn = document.getElementById("resetBtn");
  const soundBtn = document.getElementById("soundBtn");
  const copyBtn  = document.getElementById("copyBtn");
  const focusBtn = document.getElementById("focusBtn");
  const waterBtn = document.getElementById("waterBtn");

  const waterBack  = document.getElementById("waterBack");
  const waterFront = document.getElementById("waterFront");
  const waterInner = document.getElementById("waterInner");

  const fireInner  = document.getElementById("fireInner");
  const fireEmbers = document.getElementById("fireEmbers");
  const flameBack  = document.getElementById("flameBack");
  const flameMid   = document.getElementById("flameMid");
  const flameFront = document.getElementById("flameFront");

  const remainEl    = document.getElementById("remain");
  const remainLabel = document.getElementById("remainLabel");
  const overEl      = document.getElementById("over");
  const nowEl       = document.getElementById("nowClock");
  const windowEl    = document.getElementById("window");

  const CIRC = 2 * Math.PI * 150;
  ring.style.strokeDasharray  = CIRC;
  ring.style.strokeDashoffset = CIRC;

  /* ---- embers setup ---- */
  const embers = [];
  const EMBER_N = 12;
  for (let i = 0; i < EMBER_N; i++){
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("r", "0");
    c.setAttribute("fill", "#ff9d00");
    fireEmbers.appendChild(c);
    embers.push({ el:c, x:0, y:0, vy:0, life:0, max:1, seed:Math.random()*100, size:1.5 });
  }

  /* =================== HELPERS =================== */
  const pad = n => String(n).padStart(2, "0");
  const mod = (n, m) => ((n % m) + m) % m;

  function fmtHMS(sec){
    sec = Math.floor(Math.max(0, sec)) % 86400;
    return `${pad(Math.floor(sec / 3600))}:${pad(Math.floor(sec / 60) % 60)}:${pad(sec % 60)}`;
  }
  function fmtLong(sec){
    sec = Math.ceil(Math.max(0, sec));
    return `${Math.floor(sec / 3600)}:${pad(Math.floor(sec / 60) % 60)}:${pad(sec % 60)}`;
  }
  function fmtShort(sec){
    sec = Math.ceil(Math.max(0, sec));
    const h = Math.floor(sec / 3600);
    const m = Math.floor(sec / 60) % 60;
    const s = sec % 60;
    return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }
  function clampInt(el, max){
    let v = parseInt(el.value, 10);
    if (!Number.isFinite(v)) v = 0;
    return Math.min(Math.max(v, 0), max);
  }
  function nowSeconds(){
    const d = new Date();
    return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000;
  }
  const toHM = sec => `${pad(Math.floor(sec / 3600))}:${pad(Math.floor(sec / 60) % 60)}`;
  function parseHM(str){
    if (!str) return null;
    const m = /^(\d{1,2}):(\d{1,2})$/.exec(String(str).trim());
    if (!m) return null;
    const h = +m[1], mi = +m[2];
    if (h < 0 || h > 23 || mi < 0 || mi > 59) return null;
    return { h, m: mi };
  }

  /* =================== SOUND =================== */
  let actx = null;
  let soundOn = true;

  function audioCtx(){
    if (!soundOn) return null;
    if (!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { actx = new AC(); } catch(e){ return null; }
    }
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, delay, dur, type = "sine", vol = 0.06){
    const a = audioCtx();
    if (!a) return;
    const t0 = a.currentTime + delay;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  const playOvertime = () => {
    tone(880, 0, 0.18, "triangle", 0.07);
    tone(660, 0.22, 0.22, "triangle", 0.07);
    tone(440, 0.50, 0.38, "triangle", 0.06);
  };
  const playCongrats = () => {
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => tone(f, i * 0.11, 0.34, "sine", 0.08));
    tone(1318.5, 0.5, 0.5, "sine", 0.05);
  };
  const playStart = () => {
    tone(587.33, 0, 0.15, "sine", 0.05);
    tone(880.00, 0.16, 0.22, "sine", 0.05);
  };

  function syncSoundUI(){
    soundBtn.textContent = soundOn ? "🔊" : "🔇";
    soundBtn.title = soundOn ? "Sound on" : "Sound off";
    soundBtn.setAttribute("aria-pressed", String(soundOn));
  }

  function setSound(on, { silent = false, persist = true } = {}){
    soundOn = !!on;
    syncSoundUI();
    if (persist){
      try { localStorage.setItem("lessonTimerSound", soundOn ? "1" : "0"); } catch(e){}
    }
    if (soundOn && !silent) { audioCtx(); tone(660, 0, 0.12, "sine", 0.05); }
  }

  function restoreSound(){
    let on = null;
    try {
      const p = new URLSearchParams(location.search).get("s");
      if (p === "0") on = false;
      else if (p === "1") on = true;
    } catch(e){}
    if (on === null){
      try {
        const v = localStorage.getItem("lessonTimerSound");
        if (v === "0") on = false;
        else if (v === "1") on = true;
      } catch(e){}
    }
    if (on === null) on = true;
    setSound(on, { silent: true });
  }

  soundBtn.addEventListener("click", () => {
    setSound(!soundOn);
    saveState();
  });

  /* =================== WATER / FIRE TOGGLE =================== */
  let waterOn = true;

  function syncWaterUI(){
    waterBtn.dataset.on = waterOn ? "true" : "false";
    waterBtn.title = waterOn ? "Water & fire effect on" : "Water & fire effect off";
    waterBtn.setAttribute("aria-pressed", String(waterOn));
    const slash = waterBtn.querySelector(".drop-slash");
    if (slash) slash.style.display = waterOn ? "none" : "block";
    document.body.dataset.water = waterOn ? "on" : "off";
  }

  function setWater(on, { persist = true } = {}){
    waterOn = !!on;
    syncWaterUI();
    if (persist){
      try { localStorage.setItem("lessonTimerWater", waterOn ? "1" : "0"); } catch(e){}
    }
    if (waterOn){
      renderEffects(performance.now(), lastState.phase, lastState.pct, lastState.over);
    }
  }

  function restoreWater(){
    let on = null;
    try {
      const p = new URLSearchParams(location.search).get("water");
      if (p === "0") on = false;
      else if (p === "1") on = true;
    } catch(e){}
    if (on === null){
      try {
        const v = localStorage.getItem("lessonTimerWater");
        if (v === "0") on = false;
        else if (v === "1") on = true;
      } catch(e){}
    }
    if (on === null) on = true;
    setWater(on, { persist: false });
  }

  waterBtn.addEventListener("click", () => {
    setWater(!waterOn);
    saveState();
  });

  /* =================== WAVE & FLAME MATH =================== */
  const WATER_BOTTOM_Y = 302;
  const WATER_TOP_Y    = 38;
  const WATER_RANGE    = WATER_BOTTOM_Y - WATER_TOP_Y; // 264

  function wavePath(baseY, phase, amp, periods, steps){
    const x0 = 18, x1 = 322;
    let d = `M ${x0} ${baseY.toFixed(2)}`;
    for (let i = 1; i <= steps; i++){
      const t = i / steps;
      const x = x0 + (x1 - x0) * t;
      const y = baseY + Math.sin(t * periods * Math.PI * 2 + phase) * amp;
      d += ` L ${x.toFixed(2)} ${y.toFixed(2)}`;
    }
    d += ` L ${x1} 330 L ${x0} 330 Z`;
    return d;
  }

  function flamePath(baseY, t, h, amp, freq, seed){
    const x0 = 16, x1 = 324, steps = 28;
    let d = `M ${x0} ${baseY.toFixed(1)}`;
    for (let i = 0; i <= steps; i++){
      const u = i / steps;
      const x = x0 + (x1 - x0) * u;
      const env = Math.sin(u * Math.PI);
      const w1 = Math.sin(u * freq + t * 3.2 + seed);
      const w2 = Math.sin(u * freq * 2.1 - t * 5.5 + seed * 1.7);
      const lick = 0.55 + 0.30 * w1 + 0.15 * w2;
      const y = baseY - h * env * lick + Math.sin(u * 22 + t * 9 + seed) * amp;
      d += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    d += ` L ${x1} 330 L ${x0} 330 Z`;
    return d;
  }

  /* =================== EMITTERS =================== */
  function spawnEmber(e){
    e.x = 40 + Math.random() * 260;
    e.y = 300;
    e.vy = 25 + Math.random() * 45;
    e.life = 1.2 + Math.random() * 1.4;
    e.max = e.life;
    e.seed = Math.random() * 100;
    e.size = 1.2 + Math.random() * 2.0;
  }

  function updateEmbers(dt, intensity, ts){
    for (const e of embers){
      if (e.life <= 0){
        if (intensity > 0.2 && Math.random() < 0.06 * intensity){
          spawnEmber(e);
        } else {
          if (e.el.getAttribute("r") !== "0") e.el.setAttribute("r", "0");
          continue;
        }
      }
      e.life -= dt;
      e.y -= e.vy * dt;
      e.x += Math.sin((ts / 650) + e.seed) * 14 * dt;
      const a = Math.max(0, e.life / e.max);
      e.el.setAttribute("cx", e.x.toFixed(1));
      e.el.setAttribute("cy", e.y.toFixed(1));
      e.el.setAttribute("r", (e.size * (0.4 + 0.6 * a)).toFixed(2));
      e.el.setAttribute("opacity", (a * 0.95 * intensity).toFixed(3));
      e.el.setAttribute("fill", a > 0.65 ? "#ffd93b" : (a > 0.3 ? "#ff9d00" : "#ff5a1a"));
    }
  }

  /* =================== EFFECTS RENDERER =================== */
  let displayWater = 0;
  let fireLevel    = 0;
  let lastFxTs     = performance.now();

  function renderEffects(ts, phase, pctValue, over){
    if (!waterOn){
      lastFxTs = ts;
      return;
    }

    let dt = (ts - lastFxTs) / 1000;
    if (!Number.isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(dt, 0.1);
    lastFxTs = ts;

    let targetWater, targetFire, waterSpeed, fireSpeed;
    if (phase === "ended"){
      targetWater = 0; targetFire = 0;
      waterSpeed  = 4.2;
      fireSpeed   = 3.6;
    } else if (phase === "overtime"){
      targetWater = 0; targetFire = 1;
      waterSpeed  = 3.0; fireSpeed = 2.2;
    } else if (phase === "live"){
      targetWater = pctValue; targetFire = 0;
      waterSpeed  = 3.0; fireSpeed = 2.2;
    } else {
      targetWater = 0; targetFire = 0;
      waterSpeed  = 3.0; fireSpeed = 2.2;
    }

    displayWater += (targetWater - displayWater) * Math.min(1, dt * waterSpeed);
    fireLevel    += (targetFire  - fireLevel)    * Math.min(1, dt * fireSpeed);

    if (Math.abs(displayWater) < 0.0015) displayWater = 0;
    if (Math.abs(fireLevel)    < 0.0015) fireLevel    = 0;

    const t = ts / 1000;

    const wPct  = Math.max(0, Math.min(1, displayWater));
    const baseY = WATER_BOTTOM_Y - wPct * WATER_RANGE;

    const ampScale = Math.min(1, wPct * 12);
    const ampB = 7 * ampScale;
    const ampF = 5 * ampScale;

    waterBack.setAttribute("d",  wavePath(baseY,     t * 1.15,        ampB, 2.5, 30));
    waterFront.setAttribute("d", wavePath(baseY + 2, t * 1.85 + 2.1,  ampF, 2.0, 30));

    waterInner.style.opacity = Math.max(0, 1 - fireLevel * 1.15).toFixed(3);

    if (fireLevel > 0.005){
      const overSec = over || 0;
      const grow    = Math.min(1, overSec / 900);
      const h       = (55 + 115 * grow) * fireLevel;

      flameBack.setAttribute("d",  flamePath(306, t * 1.00,        h * 1.15, 7, 6.5, 0.0));
      flameMid.setAttribute("d",   flamePath(306, t * 1.25 + 1.3,  h * 0.85, 6, 8.0, 1.7));
      flameFront.setAttribute("d", flamePath(306, t * 0.85 + 2.6,  h * 0.58, 5, 9.5, 3.3));
    }
    fireInner.style.opacity = Math.min(1, fireLevel * 1.25).toFixed(3);

    updateEmbers(dt, fireLevel, ts);
  }

  /* =================== FOCUS MODE =================== */
  let focusMode = false;

  function setFocusMode(on, { persist = true } = {}){
    focusMode = !!on;
    document.body.classList.toggle("focus-mode", focusMode);
    const label = focusMode ? "Exit focus mode" : "Enter focus mode";
    focusBtn.setAttribute("aria-label", label);
    focusBtn.title = label;
    if (persist) saveState();
  }

  focusBtn.addEventListener("click", () => setFocusMode(!focusMode));

  /* =================== STATE =================== */
  const GRACE = 4 * 3600;
  let startSec = 9 * 3600;
  let endSec   = 10 * 3600;
  let duration = 3600;

  let ended = false;
  let endedSnap = { atSec: 0, pct: 0, over: 0 };
  let lastPhase = null;
  let lastState = { phase: "upcoming", pct: 0, handsSec: 0, over: 0 };

  /* =================== INPUTS =================== */
  function readInputs(){
    startSec = clampInt(startH, 23) * 3600 + clampInt(startM, 59) * 60;
    endSec   = clampInt(endH,   23) * 3600 + clampInt(endM,   59) * 60;
    let d = endSec - startSec;
    if (d <= 0) d += 86400;
    duration = d;
    windowEl.textContent = `${toHM(startSec)} – ${toHM(endSec)}`;
  }

  [startH, startM, endH, endM].forEach(el => {
    el.addEventListener("input", () => {
      ended = false;
      lastPhase = null;
      readInputs();
      updateEndButton();
      scheduleSave();
    });
    el.addEventListener("blur", () => {
      el.value = String(clampInt(el, (el === startH || el === endH) ? 23 : 59));
      readInputs();
      saveState();
    });
  });

  /* =================== URL / STATE PERSISTENCE =================== */
  let saveTimer = null;

  function saveState(){
    if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; }

    const params = new URLSearchParams();
    params.set("start", toHM(startSec));
    params.set("end",   toHM(endSec));
    params.set("s",     soundOn ? "1" : "0");
    params.set("water", waterOn ? "1" : "0");
    if (focusMode) params.set("focus", "1");
    if (ended){
      params.set("ended", "1");
      params.set("at",   String(Math.round(endedSnap.atSec)));
      params.set("pct",  endedSnap.pct.toFixed(4));
      params.set("over", String(Math.round(endedSnap.over)));
    }
    const search = "?" + params.toString();
    try {
      history.replaceState(null, "", location.pathname + search + location.hash);
    } catch(e){}
    try {
      localStorage.setItem("lessonTimerState", search);
    } catch(e){}
  }

  function scheduleSave(){
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(saveState, 300);
  }

  function parseStateParams(get){
    const start = get("start");
    const end   = get("end");
    const endedFlag = get("ended") === "1";
    if (!start && !end && !endedFlag) return null;
    return {
      start, end,
      ended: endedFlag,
      at:   parseFloat(get("at")),
      pct:  parseFloat(get("pct")),
      over: parseFloat(get("over"))
    };
  }

  function restoreState(){
    let data = null;

    data = parseStateParams(k => new URLSearchParams(location.search).get(k));

    if (!data){
      try {
        const raw = localStorage.getItem("lessonTimerState");
        if (raw){
          const p2 = new URLSearchParams(raw);
          data = parseStateParams(k => p2.get(k));
        }
      } catch(e){}
    }

    if (!data) return false;

    const s = parseHM(data.start);
    if (s){ startH.value = String(s.h); startM.value = String(s.m); }
    const e = parseHM(data.end);
    if (e){ endH.value = String(e.h); endM.value = String(e.m); }

    if (data.ended){
      ended = true;
      endedSnap = {
        atSec: Number.isFinite(data.at)   ? data.at   : 0,
        pct:   Number.isFinite(data.pct)  ? Math.min(1, Math.max(0, data.pct)) : 1,
        over:  Number.isFinite(data.over) ? Math.max(0, data.over) : 0
      };
    }
    return true;
  }

  window.addEventListener("pagehide", () => {
    if (saveTimer){ clearTimeout(saveTimer); saveState(); }
  });

  /* =================== BUTTONS =================== */
  function updateEndButton(){
    endBtn.disabled = ended;
    endBtn.textContent = ended ? "Ended ✓" : "Lesson End";
    resetBtn.textContent = "New lesson";
    // Reset only makes sense after the lesson has ended; hide it otherwise.
    resetBtn.hidden = !ended;
  }

  endBtn.addEventListener("click", () => {
    if (ended) return;
    ended = true;
    endedSnap = { atSec: lastState.handsSec, pct: lastState.pct, over: lastState.over };
    updateEndButton();
    playCongrats();
    celebrate();
    saveState();
    tick(performance.now());
  });

  resetBtn.addEventListener("click", () => {
    ended = false;
    lastPhase = null;
    particles.length = 0;
    updateEndButton();
    saveState();
    tick(performance.now());
  });

  /* =================== COPY LINK =================== */
  let toastTimer = null;
  function showToast(msg){
    let el = document.getElementById("toast");
    if (!el){
      el = document.createElement("div");
      el.id = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    void el.offsetWidth;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
  }

  copyBtn.addEventListener("click", async () => {
    saveState();
    const url = location.href;
    let ok = false;
    try {
      await navigator.clipboard.writeText(url);
      ok = true;
    } catch(err){
      try {
        const ta = document.createElement("textarea");
        ta.value = url;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        ok = document.execCommand("copy");
        document.body.removeChild(ta);
      } catch(err2){ ok = false; }
    }
    if (ok){
      copyBtn.textContent = "✓";
      setTimeout(() => { copyBtn.textContent = "🔗"; }, 1400);
      showToast("Link copied — bookmark it to keep your state");
    } else {
      showToast("Copy failed — copy the URL from the address bar");
    }
  });

  /* =================== RENDER LOOP =================== */
  function tick(ts){
    if (ts === undefined) ts = performance.now();
    const nowS = nowSeconds();

    let phase, pct, handsSec, over = 0, remain = 0;

    if (ended){
      phase    = "ended";
      pct      = endedSnap.pct;
      handsSec = endedSnap.atSec;
      over     = endedSnap.over;
      remain   = 0;
    } else {
      const d = mod(nowS - startSec, 86400);
      if (d <= duration){
        phase    = "live";
        pct      = duration > 0 ? d / duration : 1;
        handsSec = nowS;
        remain   = duration - d;
      } else if (d - duration <= GRACE){
        phase    = "overtime";
        pct      = 1;
        handsSec = nowS;
        over     = d - duration;
      } else {
        phase    = "upcoming";
        pct      = 0;
        handsSec = nowS;
        remain   = 86400 - d;
      }
    }
    lastState = { phase, pct, handsSec, over };

    if (phase !== lastPhase){
      if (lastPhase !== null && phase === "overtime"){
        card.classList.add("shake");
        setTimeout(() => card.classList.remove("shake"), 700);
        playOvertime();
      }
      if (lastPhase === "upcoming" && phase === "live") playStart();
      lastPhase = phase;
    }

    card.dataset.phase = phase;
    document.body.dataset.phase = phase;

    const pctInt = Math.floor(pct * 100 + 1e-9);
    if (pctNum.textContent !== String(pctInt)) pctNum.textContent = pctInt;
    ring.style.strokeDashoffset = (CIRC * (1 - pct)).toFixed(2);

    renderEffects(ts, phase, pct, over);

    digital.textContent = fmtHMS(handsSec);

    const sAng = (handsSec % 60) * 6;
    const mAng = ((handsSec / 60) % 60) * 6;
    const hAng = ((handsSec / 3600) % 12) * 30;
    handSec.setAttribute("transform",  `rotate(${sAng.toFixed(2)} 170 170)`);
    handMin.setAttribute("transform",  `rotate(${mAng.toFixed(2)} 170 170)`);
    handHour.setAttribute("transform", `rotate(${hAng.toFixed(2)} 170 170)`);

    statusText.textContent = {
      upcoming: "Upcoming",
      live:     "In progress",
      overtime: "拖堂 · Overtime",
      ended:    "Lesson ended"
    }[phase];

    if (phase === "upcoming"){
      notice.className = "notice";
      notice.textContent = `Lesson starts in ${fmtShort(remain)}`;
    } else if (phase === "live"){
      notice.className = "notice";
      notice.textContent = `${fmtShort(remain)} left`;
    } else if (phase === "overtime"){
      notice.className = "notice notice--warn";
      notice.textContent = `拖堂 +${fmtShort(over)}`;
    } else {
      notice.className = "notice notice--celebrate";
      notice.textContent = over > 0
        ? `🎉 恭喜！ Lesson ended · 拖堂 ${fmtShort(over)}`
        : `🎉 恭喜！ Lesson ended on time`;
    }

    nowEl.textContent = fmtHMS(nowS);

    remainLabel.textContent = phase === "upcoming" ? "Until start" : "Remaining";
    remainEl.textContent = (phase === "upcoming" || phase === "live") ? fmtLong(remain) : "—";

    overEl.textContent = over > 0 ? "+" + fmtLong(over) : "—";
    overEl.classList.toggle("is-warn", over > 0);
  }

  /* =================== CONFETTI =================== */
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  let cw = 0, ch = 0, dpr = 1;
  let particles = [];
  let confettiRaf = null;

  function resizeCanvas(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cw = window.innerWidth;
    ch = window.innerHeight;
    canvas.width  = Math.floor(cw * dpr);
    canvas.height = Math.floor(ch * dpr);
    canvas.style.width  = cw + "px";
    canvas.style.height = ch + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  const cssVar = name => getComputedStyle(root).getPropertyValue(name).trim();

  function celebrate(){
    const colors = [cssVar("--accent1"), cssVar("--accent2"), cssVar("--ok"), "#ffd166", "#ffffff"];
    const count = 170;
    for (let i = 0; i < count; i++){
      particles.push({
        x: cw / 2 + (Math.random() - 0.5) * 90,
        y: ch * 0.40 + (Math.random() - 0.5) * 50,
        vx: (Math.random() - 0.5) * 14,
        vy: -Math.random() * 14 - 3,
        g: 0.30 + Math.random() * 0.20,
        size: 4 + Math.random() * 7,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.36,
        color: colors[(Math.random() * colors.length) | 0],
        life: 1,
        shape: Math.random() < 0.35 ? "circle" : "rect"
      });
    }
    if (!confettiRaf) confettiRaf = requestAnimationFrame(confettiLoop);
  }

  function confettiLoop(){
    ctx.clearRect(0, 0, cw, ch);
    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.vy += p.g;
      p.vx *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life -= 0.006;
      if (p.life <= 0 || p.y > ch + 80){ particles.splice(i, 1); continue; }

      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life * 1.6);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === "circle"){
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      }
      ctx.restore();
    }
    if (particles.length){
      confettiRaf = requestAnimationFrame(confettiLoop);
    } else {
      confettiRaf = null;
      ctx.clearRect(0, 0, cw, ch);
    }
  }

  /* =================== BOOT =================== */
  restoreState();
  readInputs();
  updateEndButton();

  try {
    const urlFocus = new URLSearchParams(location.search).get("focus") === "1";
    let lsFocus = false;
    try { lsFocus = localStorage.getItem("lessonTimerFocus") === "1"; } catch(e){}
    if (urlFocus || (!location.search && lsFocus)) setFocusMode(true, { persist: false });
  } catch(e){}

  restoreSound();
  restoreWater();

  saveState();

  lastFxTs = performance.now();
  renderEffects(lastFxTs, "upcoming", 0, 0);

  tick(performance.now());

  (function loop(ts){
    tick(ts);
    requestAnimationFrame(loop);
  })(performance.now());
})();
</script>
</body>
